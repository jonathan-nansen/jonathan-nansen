name: profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/**, profile.json]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: render cards
        run: |
          python3 .github/scripts/validators.py profile.json dist/validators.svg validators.json
          python3 .github/scripts/header.py "$GITHUB_REPOSITORY_OWNER" profile.json .github/templates/header.svg dist/header.svg validators.json
          python3 .github/scripts/upstream.py "$GITHUB_REPOSITORY_OWNER" "$(jq -r .exclude_org profile.json)" dist/upstream.svg
          python3 .github/scripts/contrib3d.py "$GITHUB_REPOSITORY_OWNER" dist/contrib-3d.svg
          python3 .github/scripts/snake.py "$GITHUB_REPOSITORY_OWNER" dist/snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
