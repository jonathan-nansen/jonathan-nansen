name: profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/**]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 3d contribution graph + header
        run: |
          total=$(python3 .github/scripts/contrib3d.py "$GITHUB_REPOSITORY_OWNER" dist/contrib-3d.svg)
          sed "s/{{contributions}}/$total/" .github/templates/header.svg > dist/header.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upstream pull requests
        run: python3 .github/scripts/upstream.py "$GITHUB_REPOSITORY_OWNER" nansen-ai dist/upstream.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#d97706
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb454&color_dots=#161b22,#1f5a45,#2f9e73,#3ddc97,#ffb454

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
