<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 298" width="900" height="298" role="img" aria-labelledby="title">
  <title id="title">5 upstream pull requests in review</title>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="898" height="296" rx="14"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
    <radialGradient id="vignette" cx="80%" cy="10%" r="90%"><stop offset="0" stop-color="#7aa2ff" stop-opacity=".07"/><stop offset=".6" stop-color="#7aa2ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c8d0c9; white-space: pre; }
    .dim { fill: #5f6f66; } .amb { fill: #ffb454; } .ok { fill: #3ddc97; } .peer { fill: #7aa2ff; } .t { font-size: 13px; }
    .row { opacity: 0; transform: translateX(-8px); animation: in .35s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes in { to { opacity: 1; transform: none; } }
    .rail { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.8s linear .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out 1.8s infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .8; } 70%, 100% { transform: scale(3.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .row { opacity: 1; transform: none; animation: none; } .rail { stroke-dashoffset: 0; animation: none; } .ping { animation: none; opacity: 0; } }
  </style>
  <rect x="1" y="1" width="898" height="296" rx="14" fill="#0b0f0d" stroke="#243029"/>
  <g clip-path="url(#card)">
    <rect width="900" height="40" fill="#111713"/>
    <line x1="0" y1="40.5" x2="900" y2="40.5" stroke="#1f2a24"/>
    <text x="24" y="25"><tspan class="amb">jonathan@nansen</tspan><tspan class="dim">:~$ </tspan>git log --upstream --graph --state=open</text>
    <text x="876" y="25" class="dim t" text-anchor="end">bugs hit in prod · fixed at the source</text>
    <line x1="44" y1="76" x2="44" y2="212" stroke="#2c3a33" stroke-width="2"/>
    <line x1="44" y1="76" x2="44" y2="212" stroke="#7aa2ff" stroke-width="2" class="rail"/>
    <path d="M44 144 C 44 156, 60 156, 60 166 L 60 190 C 60 200, 44 200, 44 212" fill="none" stroke="#7aa2ff" stroke-width="2" opacity=".55" class="rail"/>
    <g class="row" style="animation-delay:0.3s"><circle cx="44" cy="76" r="5" fill="#0b0f0d" stroke="#7aa2ff" stroke-width="2"/><circle cx="44" cy="76" r="3" fill="#7aa2ff" class="ping"/><text x="72" y="81" class="amb">#3403</text><text x="146" y="81" class="peer">v4-chain</text><text x="300" y="81" class="t">release streaming subscriptions on client disconnect</text></g><g class="row" style="animation-delay:0.6s"><circle cx="44" cy="110" r="5" fill="#0b0f0d" stroke="#7aa2ff" stroke-width="2"/><text x="72" y="115" class="amb">#4748</text><text x="146" y="115" class="peer">nitro</text><text x="300" y="115" class="t">fall back to read-write when read-only l2chaindata probe fails</text></g><g class="row" style="animation-delay:0.9s"><circle cx="44" cy="144" r="5" fill="#0b0f0d" stroke="#7aa2ff" stroke-width="2"/><text x="72" y="149" class="amb">#6091</text><text x="146" y="149" class="peer">cometbft</text><text x="300" y="149" class="t">fsync parent directory after atomic rename</text></g><g class="row" style="animation-delay:1.2s"><circle cx="60" cy="178" r="5" fill="#0b0f0d" stroke="#7aa2ff" stroke-width="2"/><text x="72" y="183" class="amb">#6090</text><text x="146" y="183" class="peer">cometbft</text><text x="300" y="183" class="t">copy full conflicting block hash in LightClientAttackEvidence.Hash</text></g><g class="row" style="animation-delay:1.5s"><circle cx="44" cy="212" r="5" fill="#0b0f0d" stroke="#7aa2ff" stroke-width="2"/><text x="72" y="217" class="amb">#1983</text><text x="146" y="217" class="peer">cosmjs</text><text x="300" y="217" class="t">stop passing Infinity as bech32 decode limit</text></g>
    <line x1="24" y1="244.5" x2="876" y2="244.5" stroke="#1f2a24" class="row" style="animation-delay:1.8s"/>
    <text x="24" y="273" class="row" style="animation-delay:1.9s"><tspan class="peer">5</tspan><tspan class="dim"> in review · </tspan><tspan class="peer">4</tspan><tspan class="dim"> clients · </tspan><tspan class="ok">[ MERGED ]</tspan> 5 pull requests outside nansen-ai</text>
    <rect width="900" height="298" fill="url(#vignette)" pointer-events="none"/>
    <rect width="900" height="298" fill="url(#scan)" pointer-events="none"/>
  </g>
</svg>
